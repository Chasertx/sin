services:
  api:
    build:
      context: .
      dockerfile: src/Sin.Api/Dockerfile
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables demo users that like you back
      Jwt__Key: ${JWT_KEY:-CHANGE-ME-this-is-a-dev-only-signing-key-at-least-32-chars}
      # Database: local SQLite by default. Set DATABASE_PROVIDER=Postgres + DATABASE_URL in .env to use Supabase.
      Database__Provider: ${DATABASE_PROVIDER:-Sqlite}
      ConnectionStrings__Sin: ${DATABASE_URL:-Data Source=/data/sin.db}
      # Photos: local volume by default; Supabase Storage when these are set.
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__ServiceKey: ${SUPABASE_SERVICE_KEY:-}
      # SSO: put real values in a .env file next to this one (see .env.example). Blank = provider off.
      Sso__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Sso__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Sso__Apple__ClientId: ${APPLE_SERVICES_ID:-}
      Sso__Apple__TeamId: ${APPLE_TEAM_ID:-}
      Sso__Apple__KeyId: ${APPLE_KEY_ID:-}
      Sso__Apple__PrivateKeyPath: /secrets/apple_authkey.p8
    volumes:
      - ./data:/data                         # SQLite database, as a normal file: data/sin.db (open it in DBeaver)
      - sin-uploads:/app/wwwroot/uploads     # uploaded photos
      - ./secrets:/secrets:ro                # drop AuthKey_XXXX.p8 here as apple_authkey.p8

volumes:
  sin-uploads:
