# Render Blueprint (PRODUCTION): in the Render dashboard choose New > Blueprint and pick this repo.
# Values marked sync: false are secrets; Render asks you for them during setup.
# Use the PROD Supabase project here. Your PC's .env points at the DEV project.
services:
  - type: web
    name: get-what-ya-get-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/Sin.Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Deploy only after GitHub Actions CI (all API + app tests) passes on the commit.
    autoDeployTrigger: checksPass
    branch: main
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Jwt__Key
        generateValue: true
      - key: Database__Provider
        value: Postgres
      # Supabase > Project Settings > Database > Connection string > "Session pooler" (URI).
      # Use the session pooler: Render's free tier can't reach Supabase's IPv6-only direct host.
      - key: ConnectionStrings__Sin
        sync: false
      # Supabase > Project Settings > API: Project URL, and the service_role secret key.
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceKey
        sync: false
      - key: Supabase__Bucket
        value: ick
      # Demo users are for local development only.
      - key: Demo__SeedUsers
        value: "false"
      # Moderation API (X-Admin-Key header). Render generates a random key; find it in the dashboard.
      - key: Admin__ApiKey
        generateValue: true
      # Google sign-in is off for version 1. To enable it later, add Sso__Google__ClientId and
      # Sso__Google__ClientSecret in the Render dashboard (Environment tab).
